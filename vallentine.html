<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey Miss Mona ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background-image: url('https://source.unsplash.com/1600x900/?love,romantic');
            background-size: cover;
            font-family: Arial, sans-serif;
            text-align: center;
            color: red;
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            margin: 10px;
            border-radius: 12px;
            font-weight: bold;
        }
        .yes {
            background-color: pink;
        }
        .no {
            background-color: red;
            color: white;
        }
        .hidden {
            display: none;
        }
        .shower {
            position: absolute;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
        }
        .flower {
            position: absolute;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>
    <h1>Hey Miss Mona ❤️</h1>
    <h2>Do you want to be my Valentine? 💕</h2>
    <div class="buttons">
        <button class="yes" onclick="showFlowers()">Yes 💖</button>
        <button class="no" onclick="alert('Sorry, this option is not available! 😜')">No ❌</button>
    </div>
    <div class="shower hidden" id="shower"></div>
    
    <script>
        function showFlowers() {
            document.getElementById('shower').classList.remove('hidden');
            for (let i = 0; i < 30; i++) {
                let flower = document.createElement('div');
                flower.classList.add('flower');
                flower.innerHTML = '🌸';
                flower.style.left = Math.random() * 100 + 'vw';
                flower.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.getElementById('shower').appendChild(flower);
                setTimeout(() => { flower.remove(); }, 5000);
            }
        }
    </script>
</body>
</html>
